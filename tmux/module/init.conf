# Load tmux config modules in dependency order.

run-shell "python3 ~/.config/tmux/module/core/bind_registry.py reset"
source-file ~/.config/tmux/module/core/init.conf
source-file ~/.config/tmux/module/window/init.conf
source-file ~/.config/tmux/module/session/init.conf
source-file ~/.config/tmux/module/pane/init.conf
source-file ~/.config/tmux/module/theme/init.conf
run-shell "python3 ~/.config/tmux/module/core/bind_registry.py apply"
